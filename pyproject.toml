[project]
name = "datalab-item-comparison-tool"
version = "0.1.0"
description = "Compare item metadata and data blocks across datalab items."
readme = "README.md"
requires-python = ">=3.10,<3.12"
authors = [
    { name = "datalab development team", email = "dev@datalab-org.io" },
]
dependencies = [
    "datalab-server",
]

[project.entry-points."pydatalab.tools"]
"item-comparison" = "datalab_item_comparison_tool.provider:ItemComparisonToolProvider"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"datalab_item_comparison_tool" = ["static/frontend/*.js"]
